<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Radar Cyan Glow -->
    <radialGradient id="cyanGlow" cx="85%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle Violet Accent Glow -->
    <radialGradient id="accentGlow" cx="15%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Radar Sweep Gradient -->
    <linearGradient id="radarSweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>

    <!-- Pill Gradient -->
    <linearGradient id="pillBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <style>
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #38bdf8; letter-spacing: 1.5px; }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 54px; font-weight: 800; fill: url(#titleGrad); letter-spacing: -1.5px; }
    .tagline-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 17px; font-weight: 400; fill: #94a3b8; }
    .pill-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12.5px; font-weight: 600; fill: #e2e8f0; }
  </style>

  <!-- Base Card Frame -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="340" rx="16" fill="url(#cyanGlow)"/>
  <rect width="1200" height="340" rx="16" fill="url(#accentGlow)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="338.5" rx="15.25" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Radar Geometric Art on Right Side -->
  <g transform="translate(940, 170)" opacity="0.65">
    <!-- Concentric radar circles -->
    <circle r="130" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" fill="none"/>
    <circle r="95" stroke="#334155" stroke-width="1" fill="none"/>
    <circle r="60" stroke="#0284c7" stroke-width="1" stroke-opacity="0.4" fill="none"/>
    <circle r="25" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" fill="none"/>
    
    <!-- Crosshairs -->
    <line x1="-140" y1="0" x2="140" y2="0" stroke="#334155" stroke-width="1" stroke-opacity="0.6"/>
    <line x1="0" y1="-140" x2="0" y2="140" stroke="#334155" stroke-width="1" stroke-opacity="0.6"/>
    
    <!-- Radar Sweep Slice -->
    <path d="M0 0 L92 -65 A130 130 0 0 1 130 0 Z" fill="url(#radarSweep)"/>

    <!-- Detected Target Blips -->
    <circle cx="50" cy="-45" r="4" fill="#38bdf8"/>
    <circle cx="50" cy="-45" r="8" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" fill="none"/>
    
    <circle cx="-65" cy="35" r="3" fill="#06b6d4"/>
    <circle cx="85" cy="40" r="3.5" fill="#38bdf8"/>
    <circle cx="20" cy="70" r="2.5" fill="#818cf8"/>
  </g>

  <!-- Left Content Area -->
  <g transform="translate(64, 48)">
    <!-- Architecture Tag Badge -->
    <g transform="translate(0, 0)">
      <rect width="215" height="26" rx="13" fill="#082f49" stroke="#0284c7" stroke-width="1"/>
      <circle cx="14" cy="13" r="4" fill="#38bdf8"/>
      <text x="26" y="17" class="badge-text">AETHEROS RADAR AGENT</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="86" class="title-text">Pulse</text>

    <!-- Tagline -->
    <text x="0" y="124" class="tagline-text">Autonomous AI Viral Trend &amp; Instagram Reel Intelligence Radar</text>

    <!-- Tech Pills Row -->
    <g transform="translate(0, 168)">
      <!-- Pill 1: Next.js 16 -->
      <g transform="translate(0, 0)">
        <rect width="138" height="34" rx="8" fill="url(#pillBg)" stroke="#334155" stroke-width="1"/>
        <circle cx="18" cy="17" r="4.5" fill="#ffffff"/>
        <text x="32" y="22" class="pill-text">Next.js 16.2</text>
      </g>

      <!-- Pill 2: Anthropic Claude -->
      <g transform="translate(148, 0)">
        <rect width="186" height="34" rx="8" fill="url(#pillBg)" stroke="#334155" stroke-width="1"/>
        <circle cx="18" cy="17" r="4.5" fill="#d97706"/>
        <text x="32" y="22" class="pill-text">Anthropic Claude 3.5</text>
      </g>

      <!-- Pill 3: Apify Radar -->
      <g transform="translate(344, 0)">
        <rect width="168" height="34" rx="8" fill="url(#pillBg)" stroke="#334155" stroke-width="1"/>
        <circle cx="18" cy="17" r="4.5" fill="#06b6d4"/>
        <text x="32" y="22" class="pill-text">Apify Reel Scraper</text>
      </g>

      <!-- Pill 4: Gemini Audio AI -->
      <g transform="translate(522, 0)">
        <rect width="176" height="34" rx="8" fill="url(#pillBg)" stroke="#334155" stroke-width="1"/>
        <circle cx="18" cy="17" r="4.5" fill="#818cf8"/>
        <text x="32" y="22" class="pill-text">Gemini Audio AI</text>
      </g>
    </g>
  </g>
</svg>
